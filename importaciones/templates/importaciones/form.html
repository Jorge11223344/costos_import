{% extends "importaciones/base.html" %}
{% block content %}
<h3 class="mb-3">{{ titulo }}</h3>
<form method="post" class="bg-white p-3 border rounded">
  {% csrf_token %}
  <div class="mb-3">
    {{ form.non_field_errors }}
    {{ form.as_p }}
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary" type="submit" id="formSubmitBtn">Guardar</button>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Volver</a>
  </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.querySelector('form');
  const submitBtn = document.getElementById('formSubmitBtn');
  
  if (form && submitBtn) {
    form.addEventListener('submit', function() {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Guardando...';
    });
  }
});
</script>
{% endblock %}
