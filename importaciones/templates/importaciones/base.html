<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Importaciones{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.5"></script>
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">
  <!-- Custom: focus rings for accessibility -->
<style>
    .btn:focus-visible, a:focus-visible {
      outline: 2px solid #0d6efd;
      outline-offset: 2px;
    }
    .form-control:focus-visible {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .badge:focus-visible {
      outline: 2px solid #6c757d;
      outline-offset: 2px;
    }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <!-- Título a la izquierda -->
<span class="navbar-brand" aria-label="Menú principal">
      Costeo Importación
</span>

    <!-- Empujador para mandar botones a la derecha -->
    <div class="ms-auto d-flex gap-2">

<a class="btn btn-sm
          {% if '/importaciones/' in request.path and '/empresas/' not in request.path and '/tipos-costo/' not in request.path %}
            btn-light
          {% else %}
            btn-outline-light
          {% endif %}"
          href="{% url 'importaciones:importaciones_list' %}">
         Importaciones
       </a>

       <a class="btn btn-sm
          {% if '/empresas/' in request.path %}
            btn-light
          {% else %}
            btn-outline-light
          {% endif %}"
          href="{% url 'importaciones:empresas_list' %}">
         Empresas
       </a>

<a class="btn btn-sm
          {% if '/tipos-costo/' in request.path %}
             btn-light
          {% else %}
             btn-outline-light
          {% endif %}"
         href="{% url 'importaciones:tipos_costo_list' %}">
    Tipos de costo
</a>

      <a class="btn btn-sm
          {% if '/dashboard/' in request.path %}
            btn-light
          {% else %}
            btn-outline-light
          {% endif %}"
         href="{% url 'importaciones:dashboard' %}">
         Dashboard
       </a>

       <a class="btn btn-sm
          {% if '/evolucion/' in request.path %}
            btn-light
          {% else %}
            btn-outline-light
          {% endif %}"
         href="{% url 'importaciones:evolucion' %}"
         aria-label="Ir a evolución de importaciones">
         Evolución
       </a>

    </div>
  </div>
</nav>



<div class="container my-4">
  <div id="main-content">
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
  <script>
    $(document).ready(function() {
      $('.data-table').DataTable({
        responsive: true
      });
    });
  </script>
</body>
</html>
